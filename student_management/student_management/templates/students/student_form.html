{% extends "base_dashboard.html" %}

{% block title %}
admin Dashboard
{% endblock %}

{% block content %}


    <style>
        

        .form-container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }
        }
    </style>




<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg rounded-4">
                <div class="card-body">
                    <h3 class="text-center mb-4">
                        {% if student %}Edit{% else %}Add{% endif %} Student
                    </h3>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input class="form-control" name="roll_number"
                                   value="{{ student.roll_number|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input class="form-control" name="first_name"
                                   value="{{ student.first_name|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input class="form-control" name="last_name"
                                   value="{{ student.last_name|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email"
                                   value="{{ student.email|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" name="date_of_birth"
                                   value="{{ student.date_of_birth|default:'' }}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Course</label>
                            <input class="form-control" name="course"
                                   value="{{ student.course|default:'' }}">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Save Student
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>



{% endblock %}
