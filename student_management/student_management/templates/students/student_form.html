<h2>{% if student %}Edit{% else %}Add{% endif %} Student</h2>

<form method="post">
    {% csrf_token %}
    <input name="roll_number" placeholder="Roll No" value="{{ student.roll_number|default:'' }}"><br>
    <input name="first_name" placeholder="first_name" value="{{ student.first_name|default:'' }}"><br>
    <input name="last_name" placeholder="last_name" value="{{ student.last_name|default:'' }}"><br>
    <input name="email" placeholder="Email" value="{{ student.email|default:'' }}"><br>
    <input name="date_of_birth" placeholder="date_of_birth" value="{{ student.date_of_birth|default:'' }}"><br>
    <input name="course" placeholder="Course" value="{{ student.course|default:'' }}"><br>

    <button type="submit">Save</button>
</form>
