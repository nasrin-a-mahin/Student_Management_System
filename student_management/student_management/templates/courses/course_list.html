
{% extends "base_dashboard.html" %}

{% block title %}
admin Dashboard
{% endblock %}

{% block content %}
<h2>Welcome, {{ request.user.username }}</h2><h3>Courses</h3>

<a href="{% url 'course_create' %}">➕ Add Course</a>

<ul>
{% for course in courses %}
  <li>
    {{ course.name }}
    | <a href="{% url 'assign_students' course.id %}">Assign Students</a>
  </li>
{% endfor %}
</ul>
{% endblock %}
